# Manual runs only (Actions tab or `gh workflow run ci.yml`) — not on every push (private repo: Windows runner minutes count 2x).
# 수동 실행(workflow_dispatch) 버튼은 이 파일이 기본 브랜치(main)에 있어야 Actions 탭에 나타난다.
# 태그 없이 도는 검사 — build → test → pack(게시 없음) → nupkg 를 artifact 로. 태그(publish-nuget.yml) 전에 이것을 여러 번 초록으로 만든다.
# CI 에서만 흔들리는 테스트를 찾으려면 Actions 탭에서 수동 실행(workflow_dispatch)을 몇 번 돌린다.
name: CI

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: windows-latest   # 개발 환경과 같은 Windows (시리얼·소켓 테스트 동작 차이 방지)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test tests/Devinno.Communication.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack src/Devinno.Communication -c Release --no-build -o out

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-ci
          path: out/*.nupkg
