<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f9fc4"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c98a55"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fae7c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="680" fill="#0b1220"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#f1f5f9">Auto / Manual job model</text>
  <text x="40" y="80" font-size="15" fill="#94a3b8">Register what to read once. Queue one-shot writes. The library runs the loop, the timeouts and the reconnects.</text>

  <!-- Memory map -->
  <rect x="40" y="110" width="250" height="250" rx="12" fill="#111c2e" stroke="#2a3a52"/>
  <text x="60" y="140" font-size="17" font-weight="700" fill="#f1f5f9">PLC memory map</text>
  <rect x="60" y="158" width="210" height="84" rx="8" fill="#131f33" stroke="#2d4a66"/>
  <text x="74" y="184" font-size="14" font-weight="600" fill="#7cbfe0">Read areas</text>
  <text x="74" y="206" font-size="13" fill="#cbd5e1">D100–D140 (status)</text>
  <text x="74" y="226" font-size="13" fill="#cbd5e1">M0–M15 (alarms)</text>
  <rect x="60" y="256" width="210" height="84" rx="8" fill="#1a1d2b" stroke="#5c4433"/>
  <text x="74" y="282" font-size="14" font-weight="600" fill="#e3a574">Write areas</text>
  <text x="74" y="304" font-size="13" fill="#cbd5e1">D200 Speed</text>
  <text x="74" y="324" font-size="13" fill="#cbd5e1">M100 RunCmd</text>

  <!-- XML config -->
  <rect x="340" y="110" width="270" height="250" rx="12" fill="#111c2e" stroke="#2a3a52"/>
  <text x="360" y="140" font-size="17" font-weight="700" fill="#f1f5f9">Device XML</text>
  <rect x="360" y="158" width="230" height="84" rx="8" fill="#131f33" stroke="#2d4a66"/>
  <text x="374" y="184" font-size="14" font-weight="600" fill="#7cbfe0">Auto list (polling)</text>
  <text x="374" y="206" font-size="13" font-family="Consolas, monospace" fill="#cbd5e1">&lt;WR Device="D100"</text>
  <text x="374" y="226" font-size="13" font-family="Consolas, monospace" fill="#cbd5e1">    Count="41" /&gt;</text>
  <rect x="360" y="256" width="230" height="84" rx="8" fill="#1a1d2b" stroke="#5c4433"/>
  <text x="374" y="282" font-size="14" font-weight="600" fill="#e3a574">Named writes</text>
  <text x="374" y="304" font-size="13" font-family="Consolas, monospace" fill="#cbd5e1">&lt;Write Name="Speed"</text>
  <text x="374" y="324" font-size="13" font-family="Consolas, monospace" fill="#cbd5e1">    Device="D200" /&gt;</text>

  <line x1="272" y1="200" x2="356" y2="200" stroke="#4f9fc4" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="272" y1="298" x2="356" y2="298" stroke="#c98a55" stroke-width="2" marker-end="url(#ao)"/>

  <!-- Library -->
  <rect x="660" y="110" width="360" height="530" rx="12" fill="#16233a" stroke="#3b4f6b"/>
  <text x="680" y="140" font-size="17" font-weight="700" fill="#f1f5f9">Devinno.Communication</text>
  <text x="680" y="160" font-size="13" fill="#94a3b8">one worker thread per device</text>

  <rect x="680" y="176" width="320" height="206" rx="8" fill="#0d1626" stroke="#2a3a52"/>
  <text x="696" y="202" font-size="14" font-weight="700" fill="#f1f5f9">Each turn of the loop</text>
  <text x="696" y="228" font-size="13.5" fill="#cbd5e1">1. A Manual job waiting? Run it first.</text>
  <text x="696" y="252" font-size="13.5" fill="#cbd5e1">2. Otherwise run the next Auto job.</text>
  <text x="696" y="276" font-size="13.5" fill="#cbd5e1">3. Send, wait for the reply</text>
  <text x="712" y="296" font-size="13.5" fill="#cbd5e1">(timeout, optional retry).</text>
  <text x="696" y="320" font-size="13.5" fill="#cbd5e1">4. Raise an event with the message ID.</text>
  <text x="696" y="344" font-size="13.5" fill="#cbd5e1">5. Link lost? Reconnect; writes not sent</text>
  <text x="712" y="364" font-size="13.5" fill="#cbd5e1">are discarded and reported.</text>

  <rect x="680" y="410" width="150" height="70" rx="8" fill="#131f33" stroke="#2d4a66"/>
  <text x="694" y="436" font-size="14" font-weight="600" fill="#7cbfe0">Auto list</text>
  <text x="694" y="458" font-size="12.5" fill="#cbd5e1">repeats forever</text>
  <rect x="850" y="410" width="150" height="70" rx="8" fill="#1a1d2b" stroke="#5c4433"/>
  <text x="864" y="436" font-size="14" font-weight="600" fill="#e3a574">Manual queue</text>
  <text x="864" y="458" font-size="12.5" fill="#cbd5e1">one-shot, runs first</text>

  <line x1="755" y1="408" x2="755" y2="386" stroke="#4f9fc4" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="925" y1="408" x2="925" y2="386" stroke="#c98a55" stroke-width="2" marker-end="url(#ao)"/>

  <path d="M 612 200 L 640 200 L 640 445 L 676 445" fill="none" stroke="#4f9fc4" stroke-width="2" marker-end="url(#ab)"/>
  <text x="634" y="190" font-size="11" fill="#7cbfe0" text-anchor="middle">LoadXml</text>

  <!-- Device -->
  <rect x="1080" y="200" width="160" height="160" rx="12" fill="#111c2e" stroke="#2a3a52"/>
  <text x="1160" y="274" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="middle">PLC /</text>
  <text x="1160" y="298" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="middle">device</text>
  <line x1="1022" y1="270" x2="1076" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1076" y1="292" x2="1022" y2="292" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="1049" y="260" font-size="11" fill="#94a3b8" text-anchor="middle">request</text>
  <text x="1049" y="310" font-size="11" fill="#94a3b8" text-anchor="middle">reply</text>

  <!-- App -->
  <rect x="40" y="420" width="570" height="220" rx="12" fill="#111c2e" stroke="#2a3a52"/>
  <text x="60" y="450" font-size="17" font-weight="700" fill="#f1f5f9">Your app (a few lines)</text>
  <text x="60" y="482" font-size="13.5" font-family="Consolas, monospace" fill="#cbd5e1">plc.LoadXml("line1.xml");</text>
  <text x="60" y="506" font-size="13.5" font-family="Consolas, monospace" fill="#cbd5e1">plc.DataReceived += OnData;   // results</text>
  <text x="60" y="530" font-size="13.5" font-family="Consolas, monospace" fill="#cbd5e1">plc.Start();</text>
  <text x="60" y="554" font-size="13.5" font-family="Consolas, monospace" fill="#e3a574">plc.NamedWrite("Speed", 1500);</text>
  <text x="60" y="610" font-size="13" fill="#94a3b8">No polling loop, no reconnect code, no address in C#.</text>

  <!-- arrows app <-> library -->
  <path d="M 612 530 L 925 530 L 925 484" fill="none" stroke="#c98a55" stroke-width="2" marker-end="url(#ao)"/>
  <text x="680" y="520" font-size="12" fill="#e3a574">NamedWrite / ManualXxx</text>
  <line x1="676" y1="592" x2="614" y2="592" stroke="#5fae7c" stroke-width="2" marker-end="url(#ag)"/>
  <text x="684" y="578" font-size="12" font-weight="600" fill="#8acfa0">events (with the message ID)</text>
  <text x="684" y="597" font-size="12" fill="#8acfa0">DataReceived, WriteReceived,</text>
  <text x="684" y="615" font-size="12" fill="#8acfa0">TimeoutReceived, WriteDiscarded</text>
</svg>
